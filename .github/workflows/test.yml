name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Path dependencies live in the sibling repos — check them out
      # side by side (the family layout; the repo itself gets an
      # explicit path so the siblings land BESIDE it, not inside).
      - uses: actions/checkout@v4
        with:
          path: unidpp-archive
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-core
          path: unidpp-core
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-signatif
          path: unidpp-signatif
      - uses: actions/checkout@v4
        with:
          repository: unidpp/unidpp-log
          path: unidpp-log
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
        working-directory: unidpp-archive
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: unidpp-archive
      - run: cargo test --all
        working-directory: unidpp-archive
